<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FBF3E4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="Un ramo para vos." />
<title>Un ramo para vos</title>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="64x64" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
<main id="app" aria-label="Un ramo que se arma con cada toque">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="stageWrap">
    <canvas id="scene" role="img" aria-label="Ramo pintado en acuarela"></canvas>
    <div id="card" aria-hidden="true"><span></span></div>
  </div>
  <div id="light" aria-hidden="true"></div>
  <header id="verses" aria-live="polite">
    <div id="title"></div>
  </header>
  <div id="hint" aria-hidden="true"></div>
  <section id="final" aria-hidden="true">
    <div class="spacer"></div>
    <article class="sheet">
      <h1 class="poem-title"></h1>
      <div class="poem"></div>
      <p class="message"></p>
      <p class="sign"></p>
      <button type="button" class="again">volver a armarlo</button>
    </article>
  </section>
  <button type="button" id="sound" aria-pressed="false"></button>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
